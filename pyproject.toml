[project]
name = "demosat-fresh"
description = "Fresh implementation for DemoSat Static Flight Rule Checking."
readme = "README.md"
requires-python = ">=3.6"
license = {text = "Unlicense"}
authors = [
  { name = "muszynsk", email = "matt.muszynski@jpl.nasa.gov" },


]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Unlicense",
]
dependencies = [
  'arrow==1.2.3',
  'colorama',
  'lxml',
  'dataclasses',
  'tts-fresh'
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/NASA-JPL-TTS-Demosat/demosat_fresh"

[project.scripts]
fresh = "fresh.run_fresh:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.setuptools.package-data]
"*" = ["*.csv", "*.json"]

[build-system]
requires = [
  "setuptools", 
  "wheel", 
  "toml", 
  "tts-utilities>=0.2.1,<1.0.0", 
  "setuptools-scm"
  ]
build-backend = "setuptools.build_meta"
